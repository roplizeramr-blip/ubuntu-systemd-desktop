<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0f14">
  <title>Cloud Desktop</title>
  <style>
    :root {
      --ink: #eaf1f7;
      --muted: #8f9fb0;
      --dim: #64748b;
      --bg: #0b0f14;
      --panel: #111820;
      --line: #1e2936;
      --accent: #5eead4;
      --green: #4ade80;
      --amber: #fbbf24;
      --red: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      color: var(--ink);
      background: var(--bg);
      font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main { width: min(620px, 100%); }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 28px;
    }
    .name { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .logo {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: #12202a;
      border: 1px solid var(--line);
      color: var(--accent);
      font-weight: 700;
    }
    h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .01em; }
    .sub { margin: 1px 0 0; color: var(--dim); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
      padding: 6px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
    .pill.ready { color: var(--green); border-color: #1d3b2a; }
    .pill.ready .dot { background: var(--green); }
    .pill.bad { color: var(--red); border-color: #3b1d22; }
    .pill.bad .dot { background: var(--red); }

    h2 { margin: 0 0 10px; font-size: clamp(30px, 7vw, 44px); line-height: 1.08; letter-spacing: -.03em; font-weight: 650; }
    h2 span { color: var(--accent); }
    .lead { margin: 0 0 26px; color: var(--muted); font-size: 15px; max-width: 46ch; }

    .open {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      min-height: 50px;
      padding: 0 20px;
      border: 0;
      border-radius: 11px;
      background: var(--accent);
      color: #04211c;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .open:hover { background: #7ff5e2; }
    .open[aria-disabled="true"] {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--dim);
      cursor: not-allowed;
    }

    .notice {
      margin-top: 14px;
      padding: 11px 13px;
      border: 1px solid #3a2f16;
      border-radius: 9px;
      background: #171307;
      color: var(--amber);
      font-size: 13px;
    }
    .notice[hidden] { display: none; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 26px;
    }
    .stat { padding: 13px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); min-width: 0; }
    .stat label { display: block; margin-bottom: 4px; color: var(--dim); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .stat b { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px 18px;
      margin-top: 26px;
      padding-top: 15px;
      border-top: 1px solid var(--line);
      color: var(--dim);
      font-size: 11px;
    }
    footer b { color: var(--muted); font-weight: 600; }
    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--muted); }

    @media (max-width: 560px) {
      .stats { grid-template-columns: 1fr; }
      header { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="name">
        <div class="logo" aria-hidden="true">▣</div>
        <div>
          <h1 id="app-name">Cloud Desktop</h1>
          <p class="sub">KasmVNC</p>
        </div>
      </div>
      <div class="pill" id="pill" role="status" aria-live="polite">
        <span class="dot"></span><span id="pill-text">Checking</span>
      </div>
    </header>

    <h2>Your desktop,<br><span>one click away.</span></h2>
    <p class="lead" id="lead">A full X11 desktop streamed in the browser. Sign in with the credentials provided by the operator.</p>

    <a class="open" id="open" href="#" aria-disabled="true">Open desktop <span aria-hidden="true">↗</span></a>
    <div class="notice" id="notice" role="status" aria-live="polite" hidden></div>

    <section class="stats" aria-label="Status">
      <div class="stat"><label>Desktop</label><b id="s-desktop">Checking…</b></div>
      <div class="stat"><label>Engine</label><b id="s-engine">KasmVNC</b></div>
      <div class="stat"><label>Resolution</label><b id="s-res">—</b></div>
    </section>

    <footer>
      <div>User <b id="f-user">admin</b> · password from <code>VNC_PW</code></div>
      <div id="f-time">—</div>
    </footer>
  </main>

  <script>
    (() => {
      "use strict";
      const $ = (id) => document.getElementById(id);
      const open = $("open");
      const pill = $("pill");
      const pillText = $("pill-text");
      const notice = $("notice");
      const lead = $("lead");
      let timer = 0;

      function pillState(text, kind) {
        pillText.textContent = text;
        pill.className = "pill" + (kind ? " " + kind : "");
      }

      function say(message) {
        notice.hidden = !message;
        notice.textContent = message || "";
      }

      function setOpen(url) {
        const ok = Boolean(url);
        open.href = ok ? url : "#";
        open.setAttribute("aria-disabled", ok ? "false" : "true");
      }

      function apply(status) {
        const d = status.desktop || {};
        const url = (status.urls || {}).open || "";

        $("s-desktop").textContent = d.running ? "Running" : "Starting";
        $("s-engine").textContent = d.engine || "KasmVNC";
        $("s-res").textContent = d.resolution || "—";
        $("f-user").textContent = d.user || "admin";
        $("f-time").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

        if (url) {
          setOpen(url);
          pillState("Ready", "ready");
          say("");
          lead.textContent = "A full X11 desktop streamed in the browser. Sign in with the credentials provided by the operator.";
          return;
        }

        setOpen(null);
        if (!d.running) {
          pillState("Starting", "");
          say("The desktop is still starting. This page refreshes automatically.");
        } else {
          pillState("Not published", "bad");
          say("The desktop is running but PUBLIC_DESKTOP is off, so there is no public URL to open.");
        }
      }

      async function refresh() {
        try {
          const response = await fetch("/api/status", { cache: "no-store", headers: { Accept: "application/json" } });
          if (!response.ok) throw new Error(String(response.status));
          const payload = await response.json();
          if (!payload.ok || !payload.status) throw new Error("bad payload");
          apply(payload.status);
        } catch (error) {
          pillState("Offline", "bad");
          setOpen(null);
          say("Cannot reach the control service. Retrying…");
        } finally {
          clearTimeout(timer);
          timer = setTimeout(refresh, 5000);
        }
      }

      open.addEventListener("click", (event) => {
        if (open.getAttribute("aria-disabled") === "true") event.preventDefault();
      });

      refresh();
    })();
  </script>
</body>
</html>

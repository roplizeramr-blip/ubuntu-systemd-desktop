; Supervisor is PID 1 in this image.  Only the processes the desktop actually
; needs are started here:
;
;   dbus       session bus (GTK/Chrome/Thunar need one)
;   vnc        Xtigervnc, the X server + RFB endpoint on loopback
;   websockify RFB <-> WebSocket bridge, also serves the noVNC bundle
;   xfce       xfwm4 + xfce4-panel + xfsettingsd (no session manager)
;   nginx      the only public listener: auth, status page, WebSocket proxy
;   control    /healthz and /api/status
;   earlyoom   protects the 2 GiB cgroup
;
; The systemd compatibility daemons (journald facade, D-Bus activation facade,
; systemd user-bus bridge) are NOT started: they cost ~100 MB and a permanent
; D-Bus wake-up load, and the real systemd path is vps/ on a VPS.  They remain
; available as /etc/supervisor/conf.d/facade.conf when SYSTEMD_COMPAT=1.
[unix_http_server]
file=/run/supervisor.sock
chmod=0770
chown=root:desktop

[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/run/supervisord.pid
nodaemon=true
user=root
umask=022
childlogdir=/var/log/supervisor
minfds=1024
minprocs=200
strip_ansi=true
environment=PYTHONUNBUFFERED="1"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf

; --------------------------------------------------------------------- dbus
[program:dbus]
command=/bin/bash -c 'rm -f /run/user/1000/bus && exec /usr/bin/dbus-daemon --session --address=unix:path=/run/user/1000/bus --nofork --nopidfile'
user=desktop
priority=10
autostart=true
autorestart=true
startsecs=1
startretries=10
stopsignal=TERM
stopwaitsecs=5
environment=HOME="/home/desktop",USER="desktop",LOGNAME="desktop",XDG_RUNTIME_DIR="/run/user/1000"
stdout_logfile=/var/log/supervisor/dbus.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/dbus.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=1

; ----------------------------------------------------------------- earlyoom
[program:earlyoom]
command=/usr/bin/earlyoom -m 4 -s 1 -r 60 --avoid 'Xtigervnc|Xvnc|xfwm4|xfce4-panel|xfsettingsd|supervisord|dbus-daemon|nginx|websockify|python3'
priority=15
autostart=true
autorestart=true
startsecs=1
startretries=10
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/var/log/supervisor/earlyoom.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/earlyoom.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=1

; ---------------------------------------------------------------------- vnc
[program:vnc]
command=/usr/local/bin/start-vnc.sh
user=desktop
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=20
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=DISPLAY=":1",HOME="/home/desktop",USER="desktop",LOGNAME="desktop",XDG_RUNTIME_DIR="/run/user/1000"
stdout_logfile=/var/log/supervisor/vnc.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/vnc.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=1

; --------------------------------------------------------------- websockify
[program:websockify]
command=/usr/local/bin/start-websockify.sh
user=desktop
priority=30
autostart=true
autorestart=true
startsecs=2
startretries=20
stopsignal=TERM
stopwaitsecs=5
stopasgroup=true
killasgroup=true
environment=HOME="/home/desktop",USER="desktop",LOGNAME="desktop",XDG_RUNTIME_DIR="/run/user/1000"
stdout_logfile=/var/log/supervisor/websockify.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/websockify.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=1

; --------------------------------------------------------------------- xfce
[program:xfce]
command=/usr/local/bin/start-xfce.sh
user=desktop
priority=40
autostart=true
autorestart=true
startsecs=3
startretries=20
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=DISPLAY=":1",HOME="/home/desktop",USER="desktop",LOGNAME="desktop",XDG_RUNTIME_DIR="/run/user/1000",XDG_SESSION_TYPE="x11",XDG_CURRENT_DESKTOP="XFCE",XDG_SESSION_DESKTOP="xfce",LIBGL_ALWAYS_SOFTWARE="1",WEBKIT_DISABLE_DMABUF_RENDERER="1",GTK_A11Y="none",NO_AT_BRIDGE="1"
stdout_logfile=/var/log/supervisor/xfce.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/xfce.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=1

; -------------------------------------------------------------------- nginx
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
priority=45
autostart=true
autorestart=true
startsecs=2
startretries=20
stopsignal=QUIT
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/nginx.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/nginx.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=1

; ------------------------------------------------------------------ control
[program:control]
command=/usr/bin/python3 /usr/local/bin/control-server.py
user=root
priority=50
autostart=true
autorestart=true
startsecs=1
startretries=10
stopsignal=TERM
stopwaitsecs=5
stopasgroup=true
killasgroup=true
environment=HOME="/root",CONTROL_PORT="3001",WS_PORT="6080"
stdout_logfile=/var/log/supervisor/control.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/control.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=1

; Supervisor is PID 1 in this image.  It is intentionally named "systemd"
; in the container command so /proc/1/comm matches the compatibility layer.
[unix_http_server]
file=/run/supervisor.sock
chmod=0770
chown=root:desktop

[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/run/supervisord.pid
nodaemon=true
user=root
umask=022
childlogdir=/var/log/supervisor
minfds=1024
minprocs=200
strip_ansi=true
environment=PYTHONUNBUFFERED="1"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
priority=15
autostart=true
autorestart=true
startsecs=1
startretries=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/dbus.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/dbus.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

[program:systemd-journald]
command=/usr/bin/python3 /opt/systemd-compat/systemd-journald.py
priority=10
autostart=true
autorestart=true
startsecs=1
startretries=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/systemd-journald.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/systemd-journald.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

[program:systemd-dbus]
command=/usr/bin/python3 /opt/systemd-compat/systemd_dbus.py
priority=20
autostart=true
autorestart=true
startsecs=1
startretries=20
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/systemd-dbus.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/systemd-dbus.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

; A systemd-style *user* session bus at $XDG_RUNTIME_DIR/bus.  systemd-user
; aware desktop software (the OpenClaw Gateway companion, busctl --user, ...)
; looks for org.freedesktop.systemd1 there as well as on the system bus, and
; reports "systemd user session bus is unavailable" without it.  The bus is
; owned by the desktop user; dbus-run-session would put it under /tmp instead.
[program:user-dbus]
command=/bin/bash -c 'rm -f /run/user/1000/bus && exec /usr/bin/dbus-daemon --session --address=unix:path=/run/user/1000/bus --nofork --nopidfile'
user=desktop
priority=34
autostart=true
autorestart=true
startsecs=1
startretries=10
stopsignal=TERM
stopwaitsecs=10
environment=HOME="/home/desktop",USER="desktop",LOGNAME="desktop",XDG_RUNTIME_DIR="/run/user/1000"
stdout_logfile=/var/log/supervisor/user-dbus.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/user-dbus.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

; org.freedesktop.systemd1 on the user bus, backed by the same Supervisor
; compatibility layer as the system-bus facade.  It runs as the desktop user,
; because dbus-daemon only accepts connections from the user that owns the
; session bus; the Supervisord socket and the generated program directory are
; group-writable by "desktop" so it can still drive the compatibility layer.
[program:systemd-user-dbus]
command=/usr/bin/python3 /opt/systemd-compat/systemd_dbus.py --address unix:path=/run/user/1000/bus
user=desktop
priority=36
autostart=true
autorestart=true
startsecs=1
startretries=20
stopsignal=TERM
stopwaitsecs=10
environment=HOME="/home/desktop",USER="desktop",LOGNAME="desktop",XDG_RUNTIME_DIR="/run/user/1000"
stdout_logfile=/var/log/supervisor/systemd-user-dbus.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/systemd-user-dbus.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

; Userspace OOM protection for a small container.  Keep KasmVNC, XFCE,
; tailscaled and the supervisor out of the preferred victim set.
[program:earlyoom]
command=/usr/bin/earlyoom -m 4 -s 1 -r 60 --avoid 'Xvnc|Xorg|xfwm4|xfdesktop|xfce4-panel|xfsettingsd|tailscaled|supervisord|dbus-daemon'
priority=25
autostart=true
autorestart=true
startsecs=1
startretries=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/earlyoom.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/earlyoom.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

; KasmVNC owns the X display and the loopback HTTP/WebSocket server.  It runs
; in foreground mode so Supervisor sees the real process and can restart it.
[program:kasmvnc]
command=/usr/local/bin/start-kasmvnc.sh
user=desktop
priority=30
autostart=true
autorestart=true
startsecs=1
startretries=10
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
environment=DISPLAY=":1",HOME="/home/desktop",USER="desktop",LOGNAME="desktop",XDG_RUNTIME_DIR="/run/user/1000"
stdout_logfile=/var/log/supervisor/kasmvnc.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/kasmvnc.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

; Tailscale daemon.  It runs before the login/autoconnect helper and Serve
; helper; userspace networking is chosen at runtime when TUN is unavailable.
[program:tailscaled]
command=/usr/local/bin/start-tailscaled.sh
user=root
priority=32
autostart=true
autorestart=true
startsecs=1
startretries=20
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
environment=HOME="/root"
stdout_logfile=/var/log/supervisor/tailscaled.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/tailscaled.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

; XFCE is a separate process on the KasmVNC display.  KasmVNC is started with
; -noxstartup, so the session stays under Supervisor control.
[program:xfce]
command=/usr/local/bin/start-xfce.sh
user=desktop
priority=40
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
environment=DISPLAY=":1",HOME="/home/desktop",USER="desktop",LOGNAME="desktop",XDG_RUNTIME_DIR="/run/user/1000",XDG_SESSION_TYPE="x11",XDG_CURRENT_DESKTOP="XFCE",XDG_SESSION_DESKTOP="xfce",LIBGL_ALWAYS_SOFTWARE="1",WEBKIT_DISABLE_DMABUF_RENDERER="1",GTK_A11Y="none",NO_AT_BRIDGE="1"
stdout_logfile=/var/log/supervisor/xfce.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/xfce.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

; Optional TS_AUTHKEY onboarding.  Exits immediately when no key is supplied;
; the public control page then starts the browser login flow on demand.
[program:tailscale-autoconnect]
command=/usr/local/bin/tailscale-autoconnect.sh
user=root
priority=45
autostart=true
autorestart=false
startsecs=0
stopsignal=TERM
stopwaitsecs=10
environment=HOME="/root"
stdout_logfile=/var/log/supervisor/tailscale-autoconnect.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/tailscale-autoconnect.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

; Publishes KasmVNC on the Tailscale MagicDNS link over HTTPS (:443).
; A raw-TCP rule on the Tailscale IP is opt-in (TS_SERVE_HTTP_PORT).
[program:tailscale-serve]
command=/usr/local/bin/tailscale-serve.sh
user=root
priority=46
autostart=true
autorestart=true
startsecs=1
startretries=10
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=HOME="/root"
stdout_logfile=/var/log/supervisor/tailscale-serve.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/tailscale-serve.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

; The public port serves only this lightweight page, its JSON API, and /healthz.
[program:control]
command=/usr/bin/python3 /usr/local/bin/control-server.py
user=root
priority=50
autostart=true
autorestart=true
startsecs=1
startretries=10
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=HOME="/root"
stdout_logfile=/var/log/supervisor/control.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/control.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

; Restore the OpenClaw Gateway user service at container start.  The desktop
; app installs it into the account's home, which is image content: a rebuilt or
; recreated container loses the unit, its enablement symlink and the generated
; Supervisor program, and the app then reports the Gateway as not installed.
; This runs the same `openclaw gateway install` the app's UI runs, once, as the
; desktop user, and never fails the container.
[program:openclaw-gateway-install]
command=/usr/local/bin/openclaw-gateway-boot.sh
user=desktop
priority=60
autostart=true
autorestart=false
startsecs=0
stopsignal=TERM
stopwaitsecs=10
environment=HOME="/home/desktop",USER="desktop",LOGNAME="desktop",XDG_RUNTIME_DIR="/run/user/1000",DISPLAY=":1"
stdout_logfile=/var/log/supervisor/openclaw-gateway-install.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/openclaw-gateway-install.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

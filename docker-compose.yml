services:
  desktop:
    build:
      context: .
      dockerfile: Dockerfile
    image: ubuntu-systemd-desktop:local
    container_name: ubuntu-systemd-desktop
    hostname: ubuntu-desktop
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "3000:3000"
    shm_size: "1gb"
    environment:
      KASM_PORT: "${KASM_PORT:-6080}"
      CONTROL_PORT: "${CONTROL_PORT:-3000}"
      VNC_RESOLUTION: "${VNC_RESOLUTION:-1440x900}"
      VNC_PW: "${VNC_PW:?Set VNC_PW in .env or the shell}"
      VNC_USER: "${VNC_USER:-admin}"
      VNC_AUTH: "${VNC_AUTH:-1}"
      VNC_FRAME_RATE: "${VNC_FRAME_RATE:-60}"
      DESKTOP_PW: "${DESKTOP_PW:-}"
      TS_HOSTNAME: "${TS_HOSTNAME:-ubuntu-desktop}"
      TS_AUTHKEY: "${TS_AUTHKEY:-}"
      TS_TUN: "${TS_TUN:-userspace}"
      TS_SERVE_HTTPS_PORT: "${TS_SERVE_HTTPS_PORT:-443}"
      TS_SERVE_HTTP_PORT: "${TS_SERVE_HTTP_PORT:-0}"
      TS_SERVE_FALLBACK_TCP: "${TS_SERVE_FALLBACK_TCP:-0}"
      TS_FUNNEL: "${TS_FUNNEL:-0}"
      PUBLIC_DESKTOP: "${PUBLIC_DESKTOP:-0}"
      SWAP_ENABLED: "${SWAP_ENABLED:-0}"
      SWAP_SIZE_MB: "${SWAP_SIZE_MB:-6144}"
      SWAP_SPARSE: "${SWAP_SPARSE:-1}"
      TZ: "${TZ:-Africa/Cairo}"
      SYSTEMD_DETECT_VIRT: "${SYSTEMD_DETECT_VIRT:-none}"
      HIDE_CONTAINER: "${HIDE_CONTAINER:-0}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 8s
      start_period: 90s
      retries: 3

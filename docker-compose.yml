services:
  desktop:
    build:
      context: .
      dockerfile: Dockerfile
    image: debian-systemd-desktop:local
    container_name: debian-systemd-desktop
    hostname: debian-desktop
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "3000:3000"
    shm_size: "1gb"
    environment:
      PORT: "${PORT:-3000}"
      CONTROL_PORT: "${CONTROL_PORT:-3001}"
      WS_PORT: "${WS_PORT:-6080}"
      VNC_PORT: "${VNC_PORT:-5901}"
      VNC_RESOLUTION: "${VNC_RESOLUTION:-1280x720}"
      VNC_PW: "${VNC_PW:?Set VNC_PW in .env or the shell}"
      VNC_USER: "${VNC_USER:-admin}"
      VNC_AUTH: "${VNC_AUTH:-1}"
      DESKTOP_PW: "${DESKTOP_PW:-}"
      PUBLIC_DESKTOP: "${PUBLIC_DESKTOP:-1}"
      SWAP_ENABLED: "${SWAP_ENABLED:-0}"
      SWAP_SIZE_MB: "${SWAP_SIZE_MB:-6144}"
      SWAP_SPARSE: "${SWAP_SPARSE:-1}"
      TZ: "${TZ:-Africa/Cairo}"
      HIDE_CONTAINER: "${HIDE_CONTAINER:-0}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 8s
      start_period: 90s
      retries: 3
